# Explicit auxiliary-supervision variant; original presets remain unchanged.
input: data/samples/step3_trajectories.jsonl
manifest: data/samples/step3_manifest.json
rssm:
  recall_scale: 5.0
  recall_t: 12
  visual_recall_scale: 5.0
  visual_recall_times: [0, 1]
training:
  max_steps: 1000
  batch_size: 8
  learning_rate: 0.001
  grad_clip: 100.0
  val_every: 50
  patience: 5
  min_delta: 0.001
  num_threads: 1
