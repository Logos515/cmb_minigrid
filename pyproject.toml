[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-minigrid"
version = "0.1.0"
description = "Common Memory Bridge experiments with MiniGrid and DreamerV3-style RSSM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CMB research team" }]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "gymnasium>=0.29",
  "minigrid>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
cmb-minigrid = "cmb_minigrid.cli:main"

[tool.setuptools.packages.find]
include = ["cmb_minigrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
strict_markers = true
markers = ["smoke: fast tests that do not require a trained model or dataset"]

[tool.ruff]
line-length = 100
target-version = "py311"
